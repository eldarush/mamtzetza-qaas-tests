services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mocker:
    image: mamtzetza-mocker:latest
    build:
      context: .
      dockerfile: mocker/Dockerfile
    container_name: mamtzetza-mocker
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy

  mamtzetza:
    image: mamtzetza:latest
    build:
      context: ../Mamtzetza
      dockerfile: Dockerfile
    container_name: mamtzetza
    ports:
      - "9090:9090"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mocker:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: admin
      INPUT_EXCHANGE: omega-solider-input
      INPUT_QUEUE: omega-solider-input-queue
      OUTPUT_EXCHANGE: firefly-expert-output
      ENABLE_EXTERNAL_API: "true"
      EXTERNAL_API_BASE_URL: http://mocker:8080
      METRICS_PORT: 9090

  tests:
    image: mamtzetza-tests:latest
    build:
      context: .
      dockerfile: tests/Dockerfile
    container_name: mamtzetza-runner-tests
    entrypoint: ["sh", "-c", "sleep 15 && dotnet MamtzetzaTests.dll run test-docker.qaas.yaml"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      mamtzetza:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: mamtzetza-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - mamtzetza

  elasticsearch:
    image: elasticsearch:7.17.18
    container_name: mamtzetza-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: mamtzetza-fluent-bit
    volumes:
      - ./observability/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      - elasticsearch
