name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout Tests Repo
      uses: actions/checkout@v4
      with:
        path: mamtzetza-qaas-tests

    - name: Checkout Component Repo
      uses: actions/checkout@v4
      with:
        repository: eldarush/Mamtzetza
        ref: 85a8dcf24558f840b5bc653f4cabf6a3851623d9
        path: Mamtzetza

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.203'

    - name: Restore and Build
      working-directory: mamtzetza-qaas-tests
      run: |
        dotnet restore MamtzetzaTests.slnx --configfile NuGet.config --locked-mode
        dotnet build MamtzetzaTests.slnx --no-restore -c Release

    - name: Assertion regression tests
      working-directory: mamtzetza-qaas-tests
      run: dotnet test regression/AssertionRegressionTests.csproj --no-build -c Release --logger trx

    - name: Run Docker Compose End-to-End Tests
      working-directory: mamtzetza-qaas-tests
      run: |
        docker compose -p qaas-onboarding-ci up --build --abort-on-container-exit --exit-code-from tests

    - name: Verify documented assessment commands reject seeded source and accept repair
      working-directory: mamtzetza-qaas-tests
      run: python onboarding/verify_assessment.py --e2e --output ../assessment-verification

    - name: Capture stack evidence
      if: always()
      working-directory: mamtzetza-qaas-tests
      run: |
        mkdir -p ci-evidence
        docker compose -p qaas-onboarding-ci logs --no-color > ci-evidence/compose.log
        docker compose -p qaas-onboarding-ci cp tests:/app/evidence/. ci-evidence/ || true

    - name: Upload verification evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qaas-onboarding-evidence
        path: |
          mamtzetza-qaas-tests/ci-evidence
          mamtzetza-qaas-tests/allure-results
          mamtzetza-qaas-tests/regression/TestResults
          assessment-verification/*.log
          assessment-verification/*.json

    - name: Cleanup isolated stack
      if: always()
      working-directory: mamtzetza-qaas-tests
      run: docker compose -p qaas-onboarding-ci down --volumes --remove-orphans
