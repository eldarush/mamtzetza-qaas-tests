[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name             tail
    Path             /evidence/mamtzetza.jsonl
    Parser           json
    Read_from_Head   On
    Refresh_Interval 1

[OUTPUT]
    Name             es
    Match            *
    Host             elasticsearch
    Port             9200
    Index            mamtzetza-logs
    Type             _doc
    Suppress_Type_Name On
