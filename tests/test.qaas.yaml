MetaData:
  Team: QualityEngineering
  System: OmegaFirefly

DataSources:
  - Name: GeneratedOmegaSoldiers
    Generator: OmegaSoliderGenerator
    GeneratorConfiguration:
      Count: 5
      IdPrefix: "SOL-"
      FavoriteFood: "Shawarma"

Sessions:
  - Name: OmegaToFireflyRoundTrip
    Publishers:
      - Name: SoldierPublisher
        DataSourceNames: [GeneratedOmegaSoldiers]
        Policies:
          - LoadBalance:
              Rate: 20
        RabbitMq:
          Host: 127.0.0.1
          Port: 5672
          Username: admin
          Password: admin
          ExchangeName: omega-solider-input
          RoutingKey: /

    Consumers:
      - Name: FireflyConsumer
        TimeoutMs: 15000
        RabbitMq:
          Host: 127.0.0.1
          Port: 5672
          Username: admin
          Password: admin
          ExchangeName: firefly-expert-output
          RoutingKey: /
        Deserialize:
          Deserializer: ProtobufMessage
          SpecificType:
            AssemblyName: OmegaSolider
            TypeFullName: OmegaSolider.Messages.FireflyExpert

Assertions:
  # Test 1: Logical Transformation (All 12 fields preserved, 5 deterministic fields computed correctly)
  - Name: TransformationBusinessLogic
    Assertion: FireflyLogicalAssertion
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      ExpectedBuffName: "Quantum Disco Sparkles"
      ExpectedBonusGlow: 50
      ExpectExternalApiEnabled: true

  # Test 2: External API Mock Enrichment (GET buff + POST funny-title verified)
  - Name: ExternalApiEnrichment
    Assertion: FireflyApiEnrichmentAssertion
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      ExpectedBuffName: "Quantum Disco Sparkles"
      ExpectedBonusGlow: 50

  # Test 3: Fault Tolerance & Graceful Fallback
  - Name: ExternalApiFallback
    Assertion: FireflyFallbackAssertion
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      FallbackPrefix: "API Error Fallback"

  # Test 4: Hermetic Zero Loss (100% of input messages published reach output)
  - Name: HermeticThroughput
    Assertion: HermeticByInputOutputPercentage
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      InputNames: [SoldierPublisher]
      OutputNames: [FireflyConsumer]
      ExpectedPercentage: 100

  # Test 5: Latency SLA Threshold (< 10,000ms delay per chunk)
  - Name: MaxProcessingDelay
    Assertion: DelayByChunks
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      Input:
        Name: SoldierPublisher
        ChunkSize: 1
      Output:
        Name: FireflyConsumer
        ChunkSize: 1
      MaximumDelayMs: 10000

  # Test 6: Stress & Throughput Stability (Zero packet loss under load)
  - Name: StressThroughputBurst
    Assertion: FireflyStressAssertion
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      MinimumExpectedCount: 5

  # Test 7: Prometheus Metrics Observability Endpoint (/metrics HTTP 200 & active counters)
  - Name: MetricsObservabilityEndpoint
    Assertion: MamtzetzaMetricsAssertion
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      Host: "127.0.0.1"
      Port: 9090
      Path: "/metrics"

  # Test 8: Structured JSON Logs Compliance (Fluent Bit / Fluentd / Elasticsearch format)
  - Name: StructuredJsonLogsCompliance
    Assertion: MamtzetzaLogsAssertion
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      ExpectedLoggerPrefix: "Mamtzetza"
