MetaData:
  Team: QualityEngineering
  System: OmegaFirefly

DataSources:
  - Name: GeneratedOmegaSoldiers
    Generator: OmegaSoliderGenerator
    GeneratorConfiguration:
      Count: 5
      IdPrefix: "SOL-"
      FavoriteFood: "Shawarma"

Sessions:
  - Name: OmegaToFireflyRoundTrip
    Publishers:
      - Name: SoldierPublisher
        DataSourceNames: [GeneratedOmegaSoldiers]
        Policies:
          - LoadBalance:
              Rate: 20
        RabbitMq:
          Host: rabbitmq
          Port: 5672
          Username: admin
          Password: admin
          ExchangeName: omega-solider-input
          RoutingKey: /

    Consumers:
      - Name: FireflyConsumer
        TimeoutMs: 15000
        RabbitMq:
          Host: rabbitmq
          Port: 5672
          Username: admin
          Password: admin
          ExchangeName: firefly-expert-output
          RoutingKey: /

Assertions:
  # Test 1 (Custom): Domain Business Logic & Field Derivations
  - Name: TransformationBusinessLogic
    Assertion: FireflyLogicalAssertion
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      ExpectedBuffName: "Quantum Disco Sparkles"
      ExpectedBonusGlow: 50
      ExpectExternalApiEnabled: true

  # Test 2 (QaaS.Common.Assertions): Protobuf Contract Deserialization Validation
  - Name: OutputContractValidation
    Assertion: OutputDeserializableTo
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      OutputName: FireflyConsumer
      Deserialize:
        Deserializer: ProtobufMessage
        SpecificType:
          AssemblyName: OmegaSolider
          TypeFullName: OmegaSolider.Messages.FireflyExpert

  # Test 3 (QaaS.Common.Assertions): Batch Expected Output Count Verification
  - Name: ExpectedBatchOutputCount
    Assertion: HermeticByExpectedOutputCount
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      OutputNames: [FireflyConsumer]
      ExpectedCount: 5

  # Test 4 (QaaS.Common.Assertions): Hermetic Zero Loss Throughput (100%)
  - Name: HermeticThroughput
    Assertion: HermeticByInputOutputPercentage
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      InputNames: [SoldierPublisher]
      OutputNames: [FireflyConsumer]
      ExpectedPercentage: 100

  # Test 5 (QaaS.Common.Assertions): Maximum Chunk Transit Delay (< 10,000ms)
  - Name: MaxProcessingDelayByChunks
    Assertion: DelayByChunks
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      Input:
        Name: SoldierPublisher
        ChunkSize: 1
      Output:
        Name: FireflyConsumer
        ChunkSize: 1
      MaximumDelayMs: 10000

  # Test 6 (QaaS.Common.Assertions): Average Transit Delay (< 5,000ms)
  - Name: ProcessingDelayByAverage
    Assertion: DelayByAverage
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      InputName: SoldierPublisher
      OutputName: FireflyConsumer
      MaximumDelayMs: 5000

  # Test 7 (Custom): Prometheus Metrics Observability Endpoint (/metrics HTTP 200 & active counters)
  - Name: MetricsObservabilityEndpoint
    Assertion: MamtzetzaMetricsAssertion
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      Host: "mamtzetza"
      Port: 9090
      Path: "/metrics"

  # Test 8 (Custom): Structured JSON Logging Schema (Fluent Bit / Fluentd / Elasticsearch format)
  - Name: StructuredJsonLogsCompliance
    Assertion: MamtzetzaLogsAssertion
    SessionNames: [OmegaToFireflyRoundTrip]
    AssertionConfiguration:
      ExpectedLoggerPrefix: "Mamtzetza"
